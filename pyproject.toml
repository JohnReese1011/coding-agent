[project]
name = "local-coding-agent"
version = "0.1.0"
description = "Multi-provider multi-agent coding assistant using LangGraph, cloud/local LLMs, embeddings and MCP stdio"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain>=1.0,<2",
  "langchain-ollama>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "langchain-mcp-adapters>=0.1.0",
  "mcp>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "pydantic>=2.8",
  "httpx>=0.27",
  "langgraph-cli[inmem]>=0.2.6",
]
[project.optional-dependencies]
rag = ["langchain-milvus>=0.3", "pymilvus>=2.5"]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
coding-agent = "coding_agent.cli:main"
coding-agent-api = "coding_agent.api:run"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
